    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.16"/><stop offset="1" stop-color="#000" stop-opacity="0.04"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="810" fill="url(#bg)"/>
